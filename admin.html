<body class="bg-gray-50 min-h-screen">
<script>
var AdminCore = (function () {
  var _WEB_APP_URL = (typeof Config !== 'undefined') ? Config.DEPLOY : '';
  var BYTE_LIMIT = {
    '자율활동':   1500,
    '동아리활동': 1500,
    '진로활동':   2100,
    '개인별세특': 1500,
    '행동발달':   1500
  };
  var state = {
    adminId:          '',
    adminName:        '',
    adminAuth:        '',
    adminClass:       '',
    allClasses:       [],
    currentClass:     '',
    currentMenu:      '',
    currentArea:      '',
    currentStudentId: '',
    studentList:      [],
    suneungData:      null,   
    hasUnsavedEdit:   false,  
    isLoading:        false,  
    pendingDownload:  false   
  };
  async function apiGet(action, params) {
    params = params || {};
    var url = new URL(_WEB_APP_URL);
    url.searchParams.set('action', action);
    for (var key in params) {
      if (Object.prototype.hasOwnProperty.call(params, key)) {
        url.searchParams.set(key, params[key]);
      }
    }
    var res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
    if (!res.ok) throw new Error('서버 응답 오류: ' + res.status);
    var text = await res.text();
    if (!text || !text.trim()) {
      return { success: true };
    }
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('응답 파싱 오류: ' + e.message + ' / 응답내용: ' + text.substring(0, 100));
    }
  }
  async function apiPost(action, params) {
    params = params || {};
    var body = Object.assign({ action: action }, params);
    var res = await fetch(_WEB_APP_URL, {
      method:   'POST',
      redirect: 'follow',
      headers:  { 'Content-Type': 'text/plain' },
      body:     JSON.stringify(body)
    });
    if (!res.ok) throw new Error('서버 응답 오류: ' + res.status);
    var text = await res.text();
    if (!text || !text.trim()) {
      return { success: true };
    }
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('응답 파싱 오류: ' + e.message + ' / 응답내용: ' + text.substring(0, 100));
    }
  }
  function calcBytes(str) {
    if (!str) return 0;
    try { return new TextEncoder().encode(String(str)).length; }
    catch (e) {
      var s = String(str), b = 0;
      for (var i = 0; i < s.length; i++) {
        var c = s.charCodeAt(i);
        b += c < 0x80 ? 1 : (c < 0x800 ? 2 : 3);
      }
      return b;
    }
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,  '&amp;')
      .replace(/</g,  '&lt;')
      .replace(/>/g,  '&gt;')
      .replace(/"/g,  '&quot;')
      .replace(/'/g,  '&#39;');
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  return {
    state:        state,
    BYTE_LIMIT:   BYTE_LIMIT,
    apiGet:       apiGet,
    apiPost:      apiPost,
    calcBytes:    calcBytes,
    escapeHtml:   escapeHtml,
    fallbackCopy: fallbackCopy
  };
})();
</script>
<script src="admin_suneung.js"></script>
<script src="admin_univer.js"></script>
<script src="admin_repoper.js"></script>
<script src="admin_repoarea.js"></script>
<script src="admin_course.js"></script>
<script>
var Admin = (function () {
  window.addEventListener('beforeunload', function (e) {
    if (AdminCore.state.hasUnsavedEdit) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  function _init() {
    var raw = sessionStorage.getItem('adminInfo');
    if (!raw) {
      NaviComponent.showLoading('로그인 정보가 없습니다. 로그인 페이지로 이동합니다...');
      location.href = 'index.html';
      return;
    }
    var info = JSON.parse(raw);
    AdminCore.state.adminId    = info.adminId    || '';
    AdminCore.state.adminName  = info.adminName  || '';
    AdminCore.state.adminAuth  = info.adminAuth  || '';
    AdminCore.state.adminClass = info.adminClass || '';
    AdminCore.state.allClasses = info.allClasses || [];
    AdminCore.state.currentClass = (AdminCore.state.adminAuth === '관리자')
                                   ? '전체' : AdminCore.state.adminClass;
    _renderHeader();
    _loadStudentList();
  }
  function _renderHeader() {
    document.getElementById('admin-greeting').textContent =
      AdminCore.state.adminName + ' 선생님 접속했습니다.';
    if (AdminCore.state.adminAuth === '관리자') {
      document.getElementById('auth-label').textContent = '권한 : ';
      var wrapper = document.getElementById('class-select-wrapper');
      wrapper.innerHTML = '';
      var select = document.createElement('select');
      select.id = 'class-dropdown';
      var optAll = document.createElement('option');
      optAll.value = '전체'; optAll.textContent = '전체';
      select.appendChild(optAll);
      AdminCore.state.allClasses.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c + '반';
        select.appendChild(opt);
      });
      select.value = AdminCore.state.currentClass;
      select.addEventListener('change', function () {
        AdminCore.state.currentClass = this.value;
        _loadStudentList();
        _refreshContent();
      });
      wrapper.appendChild(select);
    } else {
      document.getElementById('auth-label').textContent = '권한 : ';
      document.getElementById('class-select-wrapper').innerHTML =
        '<span style="font-size:0.78rem;font-weight:600;color:#475569;">'
        + AdminCore.state.adminClass + '반</span>';
    }
  }
  async function _loadStudentList() {
    _showSidebarSkeleton();
    NaviComponent.showLoading('불러오는 중입니다...');
    try {
      var res = await AdminCore.apiGet('adminGetStudentList', {
        adminId:     AdminCore.state.adminId,
        filterClass: AdminCore.state.currentClass
      });
      NaviComponent.hideLoading();
      if (res.success) {
        AdminCore.state.studentList = res.data;
        if (AdminCore.state.currentMenu === 'gibu_area') {
          AdminRepoArea.renderAreaButtons();
        } else {
          _renderStudentList(res.data);
        }
      } else {
        document.getElementById('student-list').innerHTML =
          '<p class="text-red-400 text-xs p-3">' + res.message + '</p>';
        NaviComponent.showAlert(res.message || '학생 명단을 불러오지 못했습니다.', null, { icon: '⚠️' });
      }
    } catch (err) {
      NaviComponent.hideLoading();
      document.getElementById('student-list').innerHTML =
        '<p class="text-red-400 text-xs p-3">오류: ' + err.message + '</p>';
      NaviComponent.showAlert('학생 명단 로드 중 오류가 발생했습니다.<br>' + err.message, null, { icon: '⚠️' });
    }
  }
  function _showSidebarSkeleton() {
    var html = '';
    for (var i = 0; i < 8; i++) {
      html += '<div class="flex items-center gap-2 px-3 py-2 border-b border-gray-100">'
            + '<div class="skeleton-box w-10 h-3"></div>'
            + '<div class="skeleton-box flex-1 h-3"></div>'
            + '</div>';
    }
    document.getElementById('student-list').innerHTML = html;
  }
  function _renderStudentList(students) {
    var ul = document.getElementById('student-list');
    if (!students || students.length === 0) {
      ul.innerHTML = '<p class="text-gray-400 text-sm p-3 text-center">학생 명단을 불러오는 중입니다.</p>';
      return;
    }
    ul.innerHTML = '';
    if (AdminCore.state.currentMenu === 'suneung') {
      var liAll = document.createElement('div');
      liAll.className = 'student-item student-item-all flex items-center gap-2 cursor-pointer';
      liAll.dataset.id = '__ALL__';
      liAll.innerHTML =
        '<span class="flex items-center justify-center w-7 h-7 rounded-lg bg-sky-100 text-sky-600 shrink-0">'
        + '<svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8 0 4 4 0 018 0zm6 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>'
        + '</span>'
        + '<span class="text-sm font-bold truncate">전체 학생</span>';
      liAll.addEventListener('click', function () {
        document.querySelectorAll('.student-item').forEach(function (el) { el.classList.remove('active'); });
        liAll.classList.add('active');
        AdminCore.state.currentStudentId = '';
        AdminSuneung.render(AdminCore.state.suneungData, null);
      });
      ul.appendChild(liAll);
      if (!AdminCore.state.currentStudentId) liAll.classList.add('active');
    }
    students.forEach(function (s) {
      var li = document.createElement('div');
      li.className = 'student-item flex items-center gap-2 cursor-pointer';
      li.dataset.id = s.studentId;
      li.innerHTML =
        '<span class="text-xs text-gray-400 w-12 shrink-0 font-mono">' + s.studentId + '</span>'
        + '<span class="text-sm font-semibold text-gray-800 truncate">' + s.name + '</span>';
      li.addEventListener('click', function () {
        document.querySelectorAll('.student-item').forEach(function (el) { el.classList.remove('active'); });
        li.classList.add('active');
        AdminCore.state.currentStudentId = s.studentId;
        var menu = AdminCore.state.currentMenu;
        if (menu === 'gibu_personal') {
          AdminRepoPer.renderForStudent(s.studentId);
        } else if (menu === 'univ') {
          AdminUniver.renderForStudent(s);
        } else if (menu === 'suneung') {
          AdminSuneung.render(AdminCore.state.suneungData, s.studentId);
        }
      });
      ul.appendChild(li);
    });
  }
  function _onMenuClick(menu) {
    if (AdminCore.state.hasUnsavedEdit) {
      _showUnsavedModal('페이지를 이동하면 저장하지 않은 편집 내용이 사라집니다.', function () {
        AdminCore.state.hasUnsavedEdit = false;
        _doMenuClick(menu);
      });
      return;
    }
    _doMenuClick(menu);
  }
  function _doMenuClick(menu) {
    AdminCore.state.currentMenu      = menu;
    AdminCore.state.currentStudentId = '';
    document.querySelectorAll('.menu-btn').forEach(function (b) { b.classList.remove('active'); });
    document.getElementById('btn-' + menu).classList.add('active');
    document.getElementById('sidebar-title').textContent =
      menu === 'gibu_area' ? '생기부 영역'
      : menu === 'course'  ? '교과관리'
      : '학생 명단';
    if (menu === 'gibu_area') {
      AdminRepoArea.renderAreaButtons();
      clearContent(_msgArrow('blue', '좌측에 있는 생기부 영역을 클릭하여 데이터를 조회하세요.'));
    } else if (menu === 'gibu_personal') {
      _renderStudentList(AdminCore.state.studentList);
      clearContent(_msgArrow('blue', '좌측에서 학생을 선택하세요.'));
    } else if (menu === 'suneung') {
      AdminCore.state.currentStudentId = '';
      _renderStudentList(AdminCore.state.studentList);
      AdminSuneung.load();
    } else if (menu === 'univ') {
      _renderStudentList(AdminCore.state.studentList);
      clearContent(_msgArrow('emerald', '좌측에서 학생을 선택하세요.'));
    } else if (menu === 'course') {
      AdminCourse.init();
    }
  }
  function _refreshContent() {
    var menu = AdminCore.state.currentMenu;
    if (!menu) return;
    if (menu === 'suneung') {
      AdminCore.state.currentStudentId = '';
      AdminSuneung.load();
    } else if (menu === 'univ') {
      AdminCore.state.currentStudentId = '';
      clearContent(_msgArrow('emerald', '좌측에서 학생을 선택하세요.'));
    } else if (menu === 'gibu_personal') {
      clearContent(_msgArrow('blue', '좌측에서 학생을 선택하세요.'));
    } else if (menu === 'gibu_area') {
      AdminRepoArea.renderAreaButtons();
      clearContent(_msgArrow('blue', '좌측에 있는 생기부 영역을 클릭하여 데이터를 조회하세요.'));
    } else if (menu === 'course') {
      AdminCourse.init();
    }
  }
  function _msgArrow(color, text) {
    var c = color === 'emerald' ? { ring: 'bg-emerald-100', icon: 'text-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200' }
                                : { ring: 'bg-blue-100',    icon: 'text-blue-500',    text: 'text-blue-700',    bg: 'bg-blue-50',    border: 'border-blue-200' };
    return '<div class="flex flex-col items-center justify-center h-64 gap-3">'
         + '<div class="flex items-center justify-center w-12 h-12 rounded-full ' + c.ring + '">'
         + '<svg class="w-6 h-6 ' + c.icon + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>'
         + '</div>'
         + '<p class="text-base font-semibold ' + c.text + ' ' + c.bg + ' border ' + c.border + ' rounded-xl px-5 py-3 shadow-sm">' + text + '</p>'
         + '</div>';
  }
  function showContentSkeleton(rows) {
    var html = '<div class="p-4 space-y-3">';
    for (var i = 0; i < (rows || 6); i++) {
      html += '<div class="skeleton-box h-4 ' + (i % 2 === 0 ? 'w-full' : 'w-3/4') + '"></div>';
    }
    html += '</div>';
    document.getElementById('content-area').innerHTML = html;
  }
  function clearContent(msg) {
    document.getElementById('content-area').innerHTML =
      msg || '<div class="flex flex-col items-center justify-center h-64 text-gray-400">'
           + '<p class="text-sm">상단 메뉴를 클릭하여 데이터를 조회하세요.</p></div>';
  }
  function showError(msg) {
    document.getElementById('content-area').innerHTML =
      '<div class="p-6 text-center">'
      + '<div class="text-4xl mb-3">⚠️</div>'
      + '<p class="text-red-600 font-medium">' + (msg || '오류가 발생했습니다.') + '</p>'
      + '</div>';
  }
  function _copyGibuContent(areaKey) {
    var srcEl = document.getElementById('gibu-original-' + areaKey);
    if (!srcEl) return;
    var text = srcEl.getAttribute('data-raw') || '';
    var fb = document.getElementById('copy-feedback-' + areaKey);
    function show() {
      if (!fb) return;
      fb.textContent = '복사 완료';
      clearTimeout(fb._hideTimer);
      fb._hideTimer = setTimeout(function () { fb.textContent = ''; }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(show, function () { AdminCore.fallbackCopy(text); show(); });
    } else { AdminCore.fallbackCopy(text); show(); }
  }
  function _copyGibuEdit(areaKey) {
    var modalTa = document.getElementById('gibu-modal-textarea');
    var fb = document.getElementById('copy-feedback-edit-' + areaKey);
    var text = '';
    if (modalTa && !document.getElementById('gibu-write-modal').classList.contains('hidden')) {
      text = modalTa.value;
    } else {
      var bytesEl = document.getElementById('gibu-edit-bytes-' + areaKey);
      if (bytesEl) {
        var card = bytesEl.closest('.bg-white');
        if (card) {
          var pDiv = card.querySelector('.gibu-preview-text[data-iseditor="1"]');
          if (pDiv) text = pDiv.getAttribute('data-raw-edit') || pDiv.textContent;
        }
      }
    }
    function show() {
      if (!fb) return;
      fb.textContent = '복사 완료';
      clearTimeout(fb._hideTimer);
      fb._hideTimer = setTimeout(function () { fb.textContent = ''; }, 2000);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(show, function () { AdminCore.fallbackCopy(text); show(); });
    } else { AdminCore.fallbackCopy(text); show(); }
  }
  function _updateEditBytes(areaKey, limit) {
    var ta    = document.getElementById('gibu-edit-' + areaKey);
    var label = document.getElementById('gibu-edit-bytes-' + areaKey);
    if (!ta || !label) return;
    var bytes = AdminCore.calcBytes(ta.value);
    label.textContent = '(' + bytes + '바이트 / ' + limit + '바이트)';
    label.style.color = bytes > limit ? '#dc2626' : '#6b7280';
    AdminCore.state.hasUnsavedEdit = true;
  }
  function _toggleGibuPreview(btn) {
    var box = btn.closest('.bg-white') ? btn.closest('.bg-white').querySelector('.gibu-preview-box') : null;
    if (!box) return;
    _doToggleBox(box, btn);
  }
  function _toggleGibuPreviewBox(box) {
    var toolbar = box.closest('.bg-white') ? box.closest('.bg-white').querySelector('.gibu-card-toolbar') : null;
    var btn = toolbar ? toolbar.querySelector('.gibu-toggle-btn') : null;
    _doToggleBox(box, btn);
  }
  function _doToggleBox(box, btn) {
    var pDiv = box.querySelector('.gibu-preview-text');
    var hint = box.querySelector('.gibu-ellipsis-hint');
    if (!pDiv) return;
    var expanded = pDiv.classList.contains('expanded');
    if (expanded) {
      pDiv.classList.remove('expanded');
      if (hint) hint.style.display = '';
      if (btn) { btn.dataset.expanded = '0'; btn.querySelector('span').textContent = '펼치기'; }
    } else {
      pDiv.classList.add('expanded');
      if (hint) hint.style.display = 'none';
      if (btn) { btn.dataset.expanded = '1'; btn.querySelector('span').textContent = '접기'; }
    }
  }
  var _infoToastTimer = null;
  function _showInfoToast(msg) {
    var existing = document.getElementById('_info-toast');
    if (existing) existing.remove();
    var downloadBtn = document.querySelector('.btn-download');
    var toast = document.createElement('div');
    toast.id = '_info-toast';
    var styles = [
      'position:fixed','z-index:9999',
      'background:linear-gradient(135deg,#3b82f6,#2563eb)',
      'color:#fff','font-size:0.88rem','font-weight:600',
      'padding:10px 20px','border-radius:10px',
      'box-shadow:0 8px 24px -4px rgba(37,99,235,0.4)',
      'letter-spacing:-0.01em','white-space:nowrap',
      'transition:opacity 0.3s ease, transform 0.3s ease','opacity:0'
    ];
    if (downloadBtn) {
      var rect = downloadBtn.getBoundingClientRect();
      styles.push('top:' + (rect.bottom + 10) + 'px');
      styles.push('left:' + rect.right + 'px');
      styles.push('transform:translateY(-10px) translateX(-100%)');
    } else {
      styles.push('top:70px'); styles.push('right:28px');
      styles.push('transform:translateY(-10px)');
    }
    toast.style.cssText = styles.join(';');
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(function () {
      toast.style.opacity = '1';
      toast.style.transform = downloadBtn ? 'translateY(0) translateX(-100%)' : 'translateY(0)';
    });
    if (_infoToastTimer) clearTimeout(_infoToastTimer);
    _infoToastTimer = setTimeout(function () {
      toast.style.opacity = '0';
      setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 320);
    }, 3000);
  }
  function _openDownloadModal() {
    var menu = AdminCore.state.currentMenu;
    if (!menu) { NaviComponent.showAlert('먼저 상단 메뉴를 클릭하여 데이터를 조회하세요.'); return; }
    if (AdminCore.state.isLoading) {
      _showInfoToast('⏳ 데이터를 로딩 중입니다. 완료되면 자동으로 다운로드합니다.');
      AdminCore.state.pendingDownload = true;
      return;
    }
    var contentArea = document.getElementById('content-area');
    var hasTable       = contentArea.querySelector('table');
    var hasUnivCard    = contentArea.querySelector('.univ-card');
    var hasGibuPersonal = (menu === 'gibu_personal' && !!AdminCore.state.currentStudentId && !!contentArea.querySelector('.gibu-area-block'));
    var hasGibuArea    = (menu === 'gibu_area' && !!contentArea.querySelector('.gibu-student-block'));
    if (!hasTable && !hasGibuPersonal && !hasGibuArea && !hasUnivCard) {
      if (menu === 'gibu_personal')  _showInfoToast('💡 좌측에서 학생을 먼저 선택하세요.');
      else if (menu === 'gibu_area') _showInfoToast('💡 좌측에서 영역을 먼저 선택하세요.');
      else if (menu === 'univ')      _showInfoToast('💡 학생을 먼저 선택한 후 데이터가 화면에 출력되면 저장 버튼을 클릭하세요.');
      else                           _showInfoToast('💡 데이터가 출력된 후 저장 버튼을 클릭하세요.');
      return;
    }
    var menuNames = { suneung: '수능선택', univ: '관심대학', gibu_personal: '생기부_개인별', gibu_area: '생기부_영역별' };
    var defaultName = menuNames[menu] || '생기부_데이터';
    if (menu === 'gibu_area' && AdminCore.state.currentArea)
      defaultName += '_' + AdminCore.state.currentArea;
    if (menu === 'gibu_personal' && AdminCore.state.currentStudentId) {
      var stuInfo = null;
      for (var si = 0; si < AdminCore.state.studentList.length; si++) {
        if (AdminCore.state.studentList[si].studentId === AdminCore.state.currentStudentId) { stuInfo = AdminCore.state.studentList[si]; break; }
      }
      defaultName += '_' + AdminCore.state.currentStudentId;
      if (stuInfo && stuInfo.name) defaultName += '_' + stuInfo.name;
    }
    document.getElementById('download-filename').value = defaultName;
    document.getElementById('download-modal').classList.remove('hidden');
  }
  function _closeDownloadModal() {
    document.getElementById('download-modal').classList.add('hidden');
  }
  function _confirmDownload() {
    var filename = (document.getElementById('download-filename').value.trim() || '생기부_데이터') + '.xlsx';
    var wb = XLSX.utils.book_new();
    var contentArea = document.getElementById('content-area');
    var table = contentArea.querySelector('table');
    var menu  = AdminCore.state.currentMenu;
    if (table) {
      var ws = XLSX.utils.table_to_sheet(table);
      var range = XLSX.utils.decode_range(ws['!ref']);
      var colWidths = [];
      for (var C = range.s.c; C <= range.e.c; C++) {
        var maxLen = 8;
        for (var R = range.s.r; R <= range.e.r; R++) {
          var cell = ws[XLSX.utils.encode_cell({r: R, c: C})];
          if (cell && cell.v) { var len = String(cell.v).length; if (len > maxLen) maxLen = len; }
        }
        colWidths.push({ wch: Math.min(maxLen + 2, 40) });
      }
      ws['!cols'] = colWidths;
      XLSX.utils.book_append_sheet(wb, ws, '데이터');
    } else {
      var rows = [];
      if (menu === 'univ') {
        var univHeaders = ['순위','대학명','전형유형','전형종류','지원학과','모집정원','수능최저','선발유형','면접유무','면접지역','면접시작일','면접종료일','실기유무','실기지역','실기시작일','실기종료일','지원성향판단','비고'];
        rows.push(univHeaders);
        contentArea.querySelectorAll('.univ-card').forEach(function (card) {
          var rankRaw  = (card.querySelector('.univ-rank-badge') || {}).textContent || '';
          var rank     = rankRaw.replace('순위', '').trim();
          var nameSpans = card.querySelectorAll('.univ-name');
          var name     = nameSpans[0] ? nameSpans[0].textContent.trim() : '';
          var dept     = nameSpans[1] ? nameSpans[1].textContent.trim() : '';
          var tagType  = (card.querySelector('.tag-type')    || {}).textContent || '';
          var tagKind  = (card.querySelector('.tag-kind')    || {}).textContent || '';
          var tagSuneung = ((card.querySelector('.tag-suneung') || {}).textContent || '').replace('수능최저:', '').trim();
          var tagJudge = (card.querySelector('.tag-judge')   || {}).textContent || '';
          var fieldMap = {};
          card.querySelectorAll('.univ-field').forEach(function (f) {
            var lbl = (f.querySelector('.univ-field-label') || {}).textContent || '';
            var val = (f.querySelector('.univ-field-value') || {}).textContent || '';
            fieldMap[lbl.trim()] = val.trim();
          });
          var memoEl = card.querySelector('.univ-memo');
          var memo = memoEl ? memoEl.textContent.replace(/^💬\s*/, '').trim() : '';
          rows.push([rank.trim(), name.trim(), tagType.trim(), tagKind.trim(), dept.trim(),
            fieldMap['모집정원'] || '', tagSuneung, fieldMap['선발유형'] || '',
            fieldMap['면접유무'] || '', fieldMap['면접지역'] || '', fieldMap['면접시작일'] || '', fieldMap['면접종료일'] || '',
            fieldMap['실기유무'] || '', fieldMap['실기지역'] || '', fieldMap['실기시작일'] || '', fieldMap['실기종료일'] || '',
            tagJudge.trim(), memo]);
        });
      } else if (menu === 'gibu_area') {
        rows.push(['반', '학번', '이름', '학생이 제출한 내용', '글자수(바이트/제한)', '교사가 작성한 내용', '편집글자수(바이트/제한)']);
        contentArea.querySelectorAll('.gibu-student-block').forEach(function (card) {
          var clsEl  = card.querySelector('.gibu-student-class');
          var sidEl  = card.querySelector('.gibu-student-id');
          var nameEl = card.querySelector('.gibu-student-name');
          var cls  = clsEl  ? clsEl.textContent.replace('반', '').trim() : '';
          var sid  = sidEl  ? sidEl.textContent.trim() : '';
          var name = nameEl ? nameEl.textContent.trim() : '';
          var bytesTxt = '';
          var byteInfoEl = card.querySelector('.gibu-bytes-info');
          if (byteInfoEl) bytesTxt = byteInfoEl.textContent.replace(/[()]/g, '').trim();
          var originalDiv = card.querySelector('[id^="gibu-original-"]');
          var content = '';
          if (originalDiv) { content = originalDiv.getAttribute('data-raw') || originalDiv.innerText.trim(); if (content === '내용 없음') content = ''; }
          var editedContent = '';
          var editTextarea = card.querySelector('textarea[id^="gibu-edit-"]');
          if (editTextarea) { editedContent = editTextarea.value; }
          else {
            var editPreviewDiv = card.querySelector('.gibu-preview-text[data-iseditor="1"]');
            if (editPreviewDiv) { editedContent = editPreviewDiv.getAttribute('data-raw-edit') || editPreviewDiv.innerText.trim(); if (editedContent === '편집 내용 없음') editedContent = ''; }
          }
          var editBytesSpan = card.querySelector('[id^="gibu-edit-bytes-"]');
          var editBytesTxt = editBytesSpan ? editBytesSpan.textContent.replace(/[()]/g, '').trim() : '';
          rows.push([cls, sid, name, content, bytesTxt, editedContent, editBytesTxt]);
        });
      } else if (menu === 'gibu_personal') {
        var personalStudentId = AdminCore.state.currentStudentId || '';
        var personalName = '';
        for (var si2 = 0; si2 < AdminCore.state.studentList.length; si2++) {
          if (AdminCore.state.studentList[si2].studentId === personalStudentId) { personalName = AdminCore.state.studentList[si2].name || ''; break; }
        }
        rows.push(['학번', personalStudentId]);
        rows.push(['이름', personalName]);
        rows.push(['영역', '글자수(바이트/제한)', '학생이 제출한 내용', '교사가 작성한 내용', '편집글자수(바이트/제한)']);
        contentArea.querySelectorAll('.gibu-area-block').forEach(function (block) {
          var areaTitleEl = block.querySelector('.gibu-area-title');
          if (!areaTitleEl) return;
          var areaName = areaTitleEl.textContent.trim();
          var bytesTxt = '';
          var byteInfoEl = block.querySelector('.gibu-bytes-info');
          if (byteInfoEl) bytesTxt = byteInfoEl.textContent.replace(/[()]/g, '').trim();
          var originalDiv = block.querySelector('[id^="gibu-original-"]');
          var originalContent = '';
          if (originalDiv) { originalContent = originalDiv.getAttribute('data-raw') || originalDiv.innerText.trim(); if (originalContent === '학생이 제출한 내용이 없음') originalContent = ''; }
          var editedContent2 = '';
          var editTextarea2 = block.querySelector('textarea[id^="gibu-edit-"]');
          if (editTextarea2) { editedContent2 = editTextarea2.value.trim(); }
          else {
            var editPreviewDiv2 = block.querySelector('.gibu-preview-text[data-iseditor="1"]');
            if (editPreviewDiv2) { editedContent2 = editPreviewDiv2.getAttribute('data-raw-edit') || editPreviewDiv2.innerText.trim(); if (editedContent2 === '편집 내용 없음') editedContent2 = ''; }
          }
          var editBytesSpan2 = block.querySelector('[id^="gibu-edit-bytes-"]');
          var editBytesTxt2 = editBytesSpan2 ? editBytesSpan2.textContent.replace(/[()]/g, '').trim() : '';
          rows.push([areaName, bytesTxt, originalContent, editedContent2, editBytesTxt2]);
        });
      }
      var ws2 = XLSX.utils.aoa_to_sheet(rows);
      var wideContentCols = menu === 'gibu_personal' ? [2, 3] : (menu === 'gibu_area' ? [3, 5] : [rows[0] ? rows[0].length - 1 : 0]);
      var headerRow2 = (menu === 'gibu_personal') ? rows[2] : rows[0];
      var colWidths2 = [];
      if (headerRow2) {
        headerRow2.forEach(function (_, i) { colWidths2.push({ wch: wideContentCols.indexOf(i) !== -1 ? 80 : 20 }); });
      }
      ws2['!cols'] = colWidths2;
      var range2 = XLSX.utils.decode_range(ws2['!ref'] || 'A1');
      var dataStartRow = (menu === 'gibu_personal') ? 3 : 1;
      for (var R2 = dataStartRow; R2 <= range2.e.r; R2++) {
        wideContentCols.forEach(function (wc) {
          var cellRef = XLSX.utils.encode_cell({r: R2, c: wc});
          if (ws2[cellRef]) { if (!ws2[cellRef].s) ws2[cellRef].s = {}; ws2[cellRef].s.alignment = { wrapText: true }; }
        });
      }
      XLSX.utils.book_append_sheet(wb, ws2, '데이터');
    }
    NaviComponent.showLoading('저장 중입니다...');
    setTimeout(function() {
      try {
        XLSX.writeFile(wb, filename);
        NaviComponent.hideLoading();
        _closeDownloadModal();
        NaviComponent.showAlert('다운로드가 완료되었습니다.', null, { icon: '✅' });
      } catch (e) {
        NaviComponent.hideLoading();
        NaviComponent.showAlert('다운로드 중 오류가 발생했습니다.<br>' + e.message, null, { icon: '⚠️' });
      }
    }, 0);
  }
  var _saveSuccessTimer = null;
  function showSaveSuccess(msg) {
    var modal = document.getElementById('save-success-modal');
    var card  = document.getElementById('save-success-card');
    var msgEl = document.getElementById('save-success-msg');
    if (!modal || !card) return;
    if (msgEl && msg) msgEl.textContent = msg;
    modal.classList.remove('hidden');
    requestAnimationFrame(function () {
      card.classList.remove('scale-95', 'opacity-0');
      card.classList.add('scale-100', 'opacity-100');
    });
    if (_saveSuccessTimer) clearTimeout(_saveSuccessTimer);
    _saveSuccessTimer = setTimeout(_closeSaveSuccess, 1400);
  }
  function _closeSaveSuccess() {
    var modal = document.getElementById('save-success-modal');
    var card  = document.getElementById('save-success-card');
    if (!modal || !card) return;
    if (_saveSuccessTimer) { clearTimeout(_saveSuccessTimer); _saveSuccessTimer = null; }
    card.classList.remove('scale-100', 'opacity-100');
    card.classList.add('scale-95', 'opacity-0');
    setTimeout(function () { modal.classList.add('hidden'); }, 180);
  }
  var _unsavedCallback = null;
  function showUnsavedModal(msg, onConfirm) {
    _unsavedCallback = onConfirm || null;
    var msgEl = document.getElementById('unsaved-modal-msg');
    if (msgEl) msgEl.textContent = msg;
    var modal = document.getElementById('unsaved-modal');
    var card  = document.getElementById('unsaved-modal-card');
    if (!modal || !card) return;
    modal.classList.remove('hidden');
    requestAnimationFrame(function () {
      card.classList.remove('scale-95', 'opacity-0');
      card.classList.add('scale-100', 'opacity-100');
    });
  }
  function _confirmUnsaved() {
    var modal = document.getElementById('unsaved-modal');
    var card  = document.getElementById('unsaved-modal-card');
    if (card) { card.classList.remove('scale-100', 'opacity-100'); card.classList.add('scale-95', 'opacity-0'); }
    setTimeout(function () {
      if (modal) modal.classList.add('hidden');
      if (_unsavedCallback) { var cb = _unsavedCallback; _unsavedCallback = null; cb(); }
    }, 180);
  }
  function _cancelUnsaved() {
    var modal = document.getElementById('unsaved-modal');
    var card  = document.getElementById('unsaved-modal-card');
    if (card) { card.classList.remove('scale-100', 'opacity-100'); card.classList.add('scale-95', 'opacity-0'); }
    setTimeout(function () { if (modal) modal.classList.add('hidden'); _unsavedCallback = null; }, 180);
  }
  function _logout() {
    var gibuModal = document.getElementById('gibu-write-modal');
    var ta = document.getElementById('gibu-modal-textarea');
    var gibuDirty = gibuModal && !gibuModal.classList.contains('hidden') && ta;
    if (gibuDirty || AdminCore.state.hasUnsavedEdit) {
      showUnsavedModal('로그아웃하면 저장하지 않은 편집 내용이 사라집니다.', function () {
        AdminCore.state.hasUnsavedEdit = false;
        document.getElementById('logout-modal').classList.remove('hidden');
      });
      return;
    }
    document.getElementById('logout-modal').classList.remove('hidden');
  }
  function _confirmLogout() { sessionStorage.removeItem('adminInfo'); location.href = 'index.html'; }
  function _cancelLogout()  { document.getElementById('logout-modal').classList.add('hidden'); }
  return {
    init:                _init,
    onMenuClick:         _onMenuClick,
    showContentSkeleton: showContentSkeleton,
    clearContent:        clearContent,
    showError:           showError,
    showSaveSuccess:     showSaveSuccess,
    showUnsavedModal:    showUnsavedModal,
    openDownloadModal:   _openDownloadModal,
    closeDownloadModal:  _closeDownloadModal,
    confirmDownload:     _confirmDownload,
    closeSaveSuccess:    _closeSaveSuccess,
    logout:              _logout,
    confirmLogout:       _confirmLogout,
    cancelLogout:        _cancelLogout,
    confirmUnsaved:      _confirmUnsaved,
    cancelUnsaved:       _cancelUnsaved,
    editUnivRank:        function (cell) { AdminUniver.editUnivRank(cell); },
    copyGibuContent:     _copyGibuContent,
    copyGibuEdit:        _copyGibuEdit,
    updateEditBytes:     _updateEditBytes,
    toggleGibuPreview:   _toggleGibuPreview,
    toggleGibuPreviewBox:_toggleGibuPreviewBox,
    openGibuWriteModal:  function (areaKey, studentId, area, limit) { AdminRepoArea.openGibuWriteModal(areaKey, studentId, area, limit); },
    closeGibuWriteModal: function () { AdminRepoArea.closeGibuWriteModal(); },
    updateModalBytes:    function () { AdminRepoArea.updateModalBytes(); },
    copyModalLeft:       function () { AdminRepoArea.copyModalLeft(); },
    copyModalRight:      function () { AdminRepoArea.copyModalRight(); },
    saveGibuModal:       function () { AdminRepoArea.saveGibuModal(); }
  };
})();
</script>

      <div class="flex items-center gap-2">
        <svg width="18" height="18" fill="none" stroke="#fff" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span style="font-size:1rem;font-weight:800;color:#fff;letter-spacing:-0.01em;">생기부 작성</span>
        <span id="gibu-modal-student-badge" style="margin-left:8px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,0.22);font-size:0.85rem;font-weight:700;color:#fff;letter-spacing:-0.01em;white-space:nowrap;"></span>
      </div>
      <button onclick="Admin.closeGibuWriteModal()"
        style="width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,0.2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;font-weight:700;transition:background 0.15s;"
        onmouseover="this.style.background='rgba(255,255,255,0.35)'"
        onmouseout="this.style.background='rgba(255,255,255,0.2)'">✕</button>
    </div>
    <div class="flex flex-1 min-h-0 overflow-hidden">
      <div class="flex flex-col" style="width:50%;border-right:1px solid #e2e8f0;min-height:0;">
        <div class="gibu-modal-pane-header" style="background:#eff6ff;">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">
            <div>
              <div style="font-size:0.82rem;font-weight:800;color:#1e40af;margin-bottom:2px;">
                📄 <span id="gibu-modal-left-label">학생 제출 내용</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:0.72rem;font-weight:600;color:#3b82f6;background:#dbeafe;padding:2px 8px;border-radius:999px;">읽기 전용</span>
                <span id="gibu-modal-left-bytes" style="font-size:0.74rem;color:#64748b;"></span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button type="button" class="gibu-copy-btn" onclick="Admin.copyModalLeft()">
                <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                내용 복사
              </button>
              <span id="gibu-modal-left-copy-fb" class="gibu-spacer" style="min-width:60px;font-size:0.74rem;color:#16a34a;font-weight:600;"></span>
            </div>
          </div>
        </div>
        <div class="gibu-modal-pane-body">
          <div id="gibu-modal-left-content" class="gibu-modal-readonly"></div>
        </div>
      </div>
      <div class="flex flex-col" style="width:50%;min-height:0;">
        <div class="gibu-modal-pane-header" style="background:#f5f3ff;">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">
            <div>
              <div style="font-size:0.82rem;font-weight:800;color:#5b21b6;margin-bottom:2px;">
                ✏️ <span id="gibu-modal-right-label">내용 편집</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:0.72rem;font-weight:600;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:999px;">편집 가능</span>
                <span id="gibu-modal-right-bytes" style="font-size:0.74rem;color:#374151;font-weight:600;"></span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button type="button" class="gibu-copy-btn" onclick="Admin.copyModalRight()">
                <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                편집 복사
              </button>
              <span id="gibu-modal-right-copy-fb" class="gibu-spacer" style="min-width:60px;font-size:0.74rem;color:#16a34a;font-weight:600;"></span>
              <button type="button" id="gibu-modal-save-btn" class="gibu-save-btn" onclick="Admin.saveGibuModal()" style="display:inline-flex;align-items:center;gap:5px;">
                <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                저장
              </button>
            </div>
          </div>
        </div>
        <div class="gibu-modal-pane-body flex flex-col">
          <textarea id="gibu-modal-textarea"
            class="gibu-modal-textarea flex-1"
            style="min-height:300px;"
            oninput="Admin.updateModalBytes()"
            placeholder="내용을 입력하세요..."></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () { Admin.init(); });
</script>
</body>
</html>
